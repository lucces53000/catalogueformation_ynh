#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2
id = "catalogueformation"
name = "Formations SDIS 53"
description.fr = "Catalogue de formations avec administration et calendriers protégés"
description.en = "Public training catalogue with restricted administration and calendars"
version = "0.1~ynh1"
maintainers = []

[upstream]
license = "NOASSERTION"
code = "https://github.com/lucces53000/Formation"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "100M"
ram.build = "100M"
ram.runtime = "256M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.agent_user]
    ask.fr = "Compte Yunohost autorisé à accéder au calendrier des agents"
    help.fr = "Choisissez un utilisateur précis. Vous pourrez ajouter ou retirer d'autres comptes dans la permission Yunohost Catalogueformation agent_calendar."
    type = "user"

    [install.fcm_service_account]
    ask.fr = "Chemin du fichier de compte de service Firebase FCM (facultatif)"
    help.fr = "La clé privée reste sur le serveur Yunohost et n'est jamais copiée dans les fichiers publics."
    type = "string"
    optional = true

[resources]
    [resources.ports.main]
    default = 3017

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.nodejs]
    version = "22"

    [resources.permissions]
        main.url = "/"
