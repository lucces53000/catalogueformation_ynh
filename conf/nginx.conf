location ^~ __PATH__/api/admin/ {
    proxy_pass http://127.0.0.1:__PORT__/api/admin/;
    proxy_set_header Host $host;
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header X-YunoHost-Permission-Admin "1";
}
location ^~ __PATH__/api/agents/ {
    proxy_pass http://127.0.0.1:__PORT__/api/agents/;
    proxy_set_header Host $host;
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header X-YunoHost-Permission-Agents "1";
}
location = __PATH__/admin.html {
    proxy_pass http://127.0.0.1:__PORT__/admin.html;
    proxy_set_header Host $host;
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header X-YunoHost-Permission-Admin "1";
}
location = __PATH__/admin-versions.html {
    proxy_pass http://127.0.0.1:__PORT__/admin-versions.html;
    proxy_set_header Host $host;
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header X-YunoHost-Permission-Admin "1";
}
location = __PATH__/agent-calendar.html {
    proxy_pass http://127.0.0.1:__PORT__/agent-calendar.html;
    proxy_set_header Host $host;
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header X-YunoHost-Permission-Agents "1";
}
location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_read_timeout 60s;
    client_max_body_size 2M;
}
